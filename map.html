                            /* 5-A. WP 마커 */
                            Object.keys(wp2lines).forEach(wp => {
                                document.querySelectorAll('.wp_' + wp).forEach(mk => {

                                });
                            });

                            /* 5-B. Line 자체 */
                            Object.keys(line2wp).forEach(cls => {
                                document.querySelectorAll('.' + cls).forEach(pl => {
                                    pl.onclick = () => activate(line2wp[cls]);
                                });
                            });
                        }

                        function wireAll() {
                            bindClicks();
                            bindHover();
                        }

                        }
