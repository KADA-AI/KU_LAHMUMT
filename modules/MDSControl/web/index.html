<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>임무계획 설정</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1>임무계획 설정</h1>
          <p id="pathText"></p>
        </div>
        <div class="actions">
          <button id="reloadBtn" type="button">다시 불러오기</button>
          <button id="saveBtn" type="button" class="primary">저장</button>
        </div>
      </header>

      <main>
        <section id="missionPanel" class="panel"></section>
        <section id="replanPanel" class="panel"></section>
      </main>

      <footer class="statusbar">
        <span id="statusText">준비 중</span>
      </footer>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
